[workspace]
members = ["crates/firewol-core", "crates/firewol-picker", "src-tauri"]
# The Tauri interface needs `npm run build` first, so plain `cargo build` covers the core only.
default-members = ["crates/firewol-core"]
resolver = "3"

[profile.release]
# Integer overflow in the Win32 and NTFS record code stops the program instead of wrapping.
overflow-checks = true
strip = "debuginfo"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
