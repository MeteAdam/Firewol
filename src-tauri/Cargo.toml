[package]
name = "firewol-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
firewol-core = { path = "../crates/firewol-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
